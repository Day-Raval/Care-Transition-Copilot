# config.yaml
data:
  fhir_dir: data/raw/fhir
  output_csv: data/processed/discharge_records.csv
  output_notes: data/processed/discharge_notes.jsonl

synthea:
  population_size: 500
  seed: 42

episodes:
  gap_threshold_hours: 6      # merge encounters into one stay if closer than this

features:
  medication_lookback_days: 180   # confirmed via testing: 90 misses real chronic
                                    # regimens with refill gaps, 365 pulls in noise
  readmission_window_days: 90     # for prior_admissions_90d