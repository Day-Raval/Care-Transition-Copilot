<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Care Transition Copilot operating value map</title>
  <desc id="desc">Production-style value map showing clinical capabilities, governed AI workflow, and measurable care-transition outcomes.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#10213f"/>
      <stop offset="1" stop-color="#1c365f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#147c78"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#a66a16"/>
    </marker>
    <style>
      .bg { fill: url(#page); }
      .ink { fill: #10213f; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #667085; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .label { fill: #344054; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .eyebrow { fill: #147c78; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
      .panel { fill: #ffffff; stroke: #d8e3e7; stroke-width: 1.5; rx: 28; filter: url(#shadow); }
      .cap { fill: #e8f5f3; stroke: #147c78; stroke-width: 2; rx: 18; }
      .out { fill: #fff5df; stroke: #a66a16; stroke-width: 2; rx: 18; }
      .guard { fill: #f2f5f9; stroke: #c9d3df; stroke-width: 1.5; rx: 16; }
      .hub { fill: url(#navyGrad); filter: url(#shadow); }
      .lineT { stroke: #147c78; stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
      .lineG { stroke: #a66a16; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .thin { stroke: #d0d9e2; stroke-width: 1.5; fill: none; }
      .num { fill: #ffffff; font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 800; font-size: 14px; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="820"/>
  <text class="eyebrow" x="84" y="78">OPERATING VALUE MAP</text>
  <text class="ink" x="84" y="138" font-size="44" font-weight="800">Turn discharge risk into completed follow-up</text>
  <text class="muted" x="84" y="178" font-size="19">A governed workflow connects prediction, evidence retrieval, drafted plans, and clinician approval.</text>

  <rect class="panel" x="72" y="210" width="1296" height="496"/>

  <text class="label" x="122" y="268" font-size="15" font-weight="800">CAPABILITIES</text>
  <text class="label" x="1088" y="268" font-size="15" font-weight="800">OUTCOMES</text>

  <g>
    <rect class="cap" x="118" y="300" width="286" height="76"/>
    <circle cx="154" cy="338" r="18" fill="#147c78"/>
    <text class="num" x="154" y="343" text-anchor="middle">1</text>
    <text class="ink" x="186" y="331" font-size="18" font-weight="800">Spot high-risk patients</text>
    <text class="muted" x="186" y="354" font-size="14">30-day risk score with model rationale</text>

    <rect class="cap" x="118" y="402" width="286" height="76"/>
    <circle cx="154" cy="440" r="18" fill="#147c78"/>
    <text class="num" x="154" y="445" text-anchor="middle">2</text>
    <text class="ink" x="186" y="433" font-size="18" font-weight="800">Retrieve chart context</text>
    <text class="muted" x="186" y="456" font-size="14">Source-backed notes and discharge facts</text>

    <rect class="cap" x="118" y="504" width="286" height="76"/>
    <circle cx="154" cy="542" r="18" fill="#147c78"/>
    <text class="num" x="154" y="547" text-anchor="middle">3</text>
    <text class="ink" x="186" y="535" font-size="18" font-weight="800">Draft follow-up plan</text>
    <text class="muted" x="186" y="558" font-size="14">Tasks, timing, and explanation</text>
  </g>

  <path class="lineT" d="M404 338 C476 338 500 384 548 404"/>
  <path class="lineT" d="M404 440 H536"/>
  <path class="lineT" d="M404 542 C476 542 500 496 548 476"/>

  <circle class="hub" cx="720" cy="440" r="116"/>
  <circle cx="720" cy="440" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="2"/>
  <text x="720" y="406" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Review-gated</text>
  <text x="720" y="436" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">care transition</text>
  <text x="720" y="466" fill="#d6f4f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI prepares</text>
  <text x="720" y="490" fill="#d6f4f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">clinicians decide</text>

  <path class="lineG" d="M836 394 C894 344 950 328 1016 322"/>
  <path class="lineG" d="M846 434 C904 422 954 420 1016 422"/>
  <path class="lineG" d="M836 486 C894 542 950 558 1016 560"/>

  <g>
    <rect class="out" x="1018" y="292" width="300" height="76"/>
    <text class="ink" x="1050" y="324" font-size="18" font-weight="800">Lower readmission exposure</text>
    <text class="muted" x="1050" y="348" font-size="14">Earlier intervention for flagged patients</text>

    <rect class="out" x="1018" y="394" width="300" height="76"/>
    <text class="ink" x="1050" y="426" font-size="18" font-weight="800">Faster care coordination</text>
    <text class="muted" x="1050" y="450" font-size="14">Clear owner, next step, and timing</text>

    <rect class="out" x="1018" y="526" width="300" height="76"/>
    <text class="ink" x="1050" y="558" font-size="18" font-weight="800">More completed follow-ups</text>
    <text class="muted" x="1050" y="582" font-size="14">Plan status visible through completion</text>
  </g>

  <g>
    <rect class="guard" x="118" y="628" width="376" height="44"/>
    <text class="label" x="142" y="656" font-size="14" font-weight="800">Fairness audit</text>
    <text class="muted" x="250" y="656" font-size="14">subgroup performance is visible</text>

    <rect class="guard" x="532" y="628" width="376" height="44"/>
    <text class="label" x="556" y="656" font-size="14" font-weight="800">Source citations</text>
    <text class="muted" x="676" y="656" font-size="14">retrieval points back to evidence</text>

    <rect class="guard" x="946" y="628" width="372" height="44"/>
    <text class="label" x="970" y="656" font-size="14" font-weight="800">Clinician sign-off</text>
    <text class="muted" x="1110" y="656" font-size="14">drafts never auto-write</text>
  </g>

  <line class="thin" x1="84" y1="750" x2="1356" y2="750"/>
  <text class="muted" x="84" y="778" font-size="14">README diagram derived from the proposal concept; not an exported proposal image.</text>
</svg>
