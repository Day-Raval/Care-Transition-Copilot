<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">High-risk discharge workflow</title>
  <desc id="desc">Swimlane workflow for a high-risk discharge from event ingestion through risk scoring, AI plan preparation, clinician review, record update, and follow-up monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef7f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#526174"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#a66a16"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .ink { fill: #10213f; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #667085; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .eyebrow { fill: #147c78; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
      .lane { fill: #ffffff; stroke: #d7e1e7; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .laneHead { fill: #10213f; }
      .node { fill: #ffffff; stroke: #d1dae4; stroke-width: 1.5; rx: 16; }
      .ai { fill: #e8f5f3; stroke: #147c78; stroke-width: 2; rx: 16; }
      .human { fill: #fff5df; stroke: #a66a16; stroke-width: 2; rx: 16; }
      .record { fill: #f3f6fb; stroke: #8a98aa; stroke-width: 2; rx: 16; }
      .line { stroke: #526174; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #a66a16; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowGold); }
      .badge { fill: #10213f; }
      .badgeText { fill: #ffffff; font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 800; font-size: 13px; }
    </style>
  </defs>

  <rect class="page" width="1440" height="840"/>
  <text class="eyebrow" x="84" y="78">WORKFLOW</text>
  <text class="ink" x="84" y="126" font-size="44" font-weight="800">High-risk discharge path</text>
  <text class="muted" x="84" y="164" font-size="19">The system prepares a care plan, but approval stays with the clinician.</text>

  <g transform="translate(72 215)">
    <rect class="lane" x="0" y="0" width="1296" height="120"/>
    <rect class="laneHead" x="0" y="0" width="178" height="120" rx="22"/>
    <text x="36" y="68" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Data layer</text>
    <rect class="node" x="232" y="26" width="182" height="68"/>
    <text class="ink" x="260" y="54" font-size="17" font-weight="800">Discharge event</text>
    <text class="muted" x="260" y="78" font-size="14">FHIR / HL7v2</text>
    <rect class="record" x="502" y="26" width="182" height="68"/>
    <text class="ink" x="530" y="54" font-size="17" font-weight="800">Episode state</text>
    <text class="muted" x="530" y="78" font-size="14">Postgres + notes</text>
    <path class="line" d="M414 60 H496"/>

    <rect class="lane" x="0" y="150" width="1296" height="120"/>
    <rect class="laneHead" x="0" y="150" width="178" height="120" rx="22"/>
    <text x="36" y="218" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Model</text>
    <rect class="ai" x="232" y="176" width="182" height="68"/>
    <text class="ink" x="260" y="204" font-size="17" font-weight="800">Risk score</text>
    <text class="muted" x="260" y="228" font-size="14">30-day readmission</text>
    <rect class="ai" x="502" y="176" width="182" height="68"/>
    <text class="ink" x="530" y="204" font-size="17" font-weight="800">Explain score</text>
    <text class="muted" x="530" y="228" font-size="14">SHAP + fairness flags</text>
    <path class="line" d="M323 94 V170"/>
    <path class="line" d="M414 210 H496"/>

    <rect class="lane" x="0" y="300" width="1296" height="120"/>
    <rect class="laneHead" x="0" y="300" width="178" height="120" rx="22"/>
    <text x="36" y="368" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Agents</text>
    <rect class="ai" x="232" y="326" width="182" height="68"/>
    <text class="ink" x="260" y="354" font-size="17" font-weight="800">Retrieve context</text>
    <text class="muted" x="260" y="378" font-size="14">Cited chart facts</text>
    <rect class="ai" x="502" y="326" width="182" height="68"/>
    <text class="ink" x="530" y="354" font-size="17" font-weight="800">Draft plan</text>
    <text class="muted" x="530" y="378" font-size="14">Tasks and timing</text>
    <rect class="ai" x="772" y="326" width="182" height="68"/>
    <text class="ink" x="800" y="354" font-size="17" font-weight="800">Critique</text>
    <text class="muted" x="800" y="378" font-size="14">Checklist review</text>
    <path class="line" d="M593 244 C593 282 323 282 323 320"/>
    <path class="line" d="M414 360 H496"/>
    <path class="line" d="M684 360 H766"/>

    <rect class="lane" x="0" y="450" width="1296" height="120"/>
    <rect class="laneHead" x="0" y="450" width="178" height="120" rx="22"/>
    <text x="36" y="518" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Clinician</text>
    <rect class="human" x="772" y="476" width="182" height="68"/>
    <text class="ink" x="800" y="504" font-size="17" font-weight="800">Review draft</text>
    <text class="muted" x="800" y="528" font-size="14">Approve / edit / reject</text>
    <rect class="human" x="1042" y="476" width="182" height="68"/>
    <text class="ink" x="1070" y="504" font-size="17" font-weight="800">Sign off</text>
    <text class="muted" x="1070" y="528" font-size="14">Release plan</text>
    <path class="line" d="M863 394 V470"/>
    <path class="line" d="M954 510 H1036"/>
    <path class="loop" d="M855 544 C835 622 522 622 578 400"/>
    <text class="muted" x="620" y="622" font-size="14">edits return to draft plan with preserved evidence</text>

    <rect class="lane" x="0" y="600" width="1296" height="120"/>
    <rect class="laneHead" x="0" y="600" width="178" height="120" rx="22"/>
    <text x="36" y="668" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Action</text>
    <rect class="record" x="772" y="626" width="182" height="68"/>
    <text class="ink" x="800" y="654" font-size="17" font-weight="800">FHIR write-back</text>
    <text class="muted" x="800" y="678" font-size="14">Approved plan only</text>
    <rect class="record" x="1042" y="626" width="182" height="68"/>
    <text class="ink" x="1070" y="654" font-size="17" font-weight="800">Follow-up</text>
    <text class="muted" x="1070" y="678" font-size="14">Reminder + outcome</text>
    <path class="line" d="M1133 544 V620"/>
    <path class="line" d="M954 660 H1036"/>

    <circle class="badge" cx="212" cy="60" r="15"/><text class="badgeText" x="212" y="65" text-anchor="middle">1</text>
    <circle class="badge" cx="212" cy="210" r="15"/><text class="badgeText" x="212" y="215" text-anchor="middle">2</text>
    <circle class="badge" cx="212" cy="360" r="15"/><text class="badgeText" x="212" y="365" text-anchor="middle">3</text>
    <circle class="badge" cx="752" cy="510" r="15"/><text class="badgeText" x="752" y="515" text-anchor="middle">4</text>
    <circle class="badge" cx="752" cy="660" r="15"/><text class="badgeText" x="752" y="665" text-anchor="middle">5</text>
  </g>
</svg>
