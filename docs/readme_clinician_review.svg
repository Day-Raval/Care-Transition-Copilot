<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Clinician review workspace concept</title>
  <desc id="desc">Production-style clinician review workspace showing a risk queue, patient evidence, AI-drafted care plan, critique checklist, and approval controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f5"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" x2="1">
      <stop offset="0" stop-color="#10213f"/>
      <stop offset="1" stop-color="#1f3f68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .page { fill: url(#bg); }
      .ink { fill: #10213f; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #667085; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .eyebrow { fill: #147c78; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
      .shell { fill: #ffffff; stroke: #d7e1e7; stroke-width: 1.5; rx: 28; filter: url(#shadow); }
      .topbar { fill: url(#topbar); }
      .side { fill: #f7fafc; stroke: #e2e8f0; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #d7e1e7; stroke-width: 1.5; rx: 18; }
      .soft { fill: #e8f5f3; stroke: #147c78; stroke-width: 1.5; rx: 14; }
      .draft { fill: #fff7e6; stroke: #a66a16; stroke-width: 1.5; rx: 14; }
      .alert { fill: #fff1f2; stroke: #c23b4b; stroke-width: 1.5; rx: 14; }
      .button { fill: #1f7a4d; rx: 12; }
      .button2 { fill: #ffffff; stroke: #147c78; stroke-width: 1.5; rx: 12; }
      .button3 { fill: #ffffff; stroke: #c23b4b; stroke-width: 1.5; rx: 12; }
      .line { stroke: #e1e7ee; stroke-width: 1.5; }
      .pill { fill: #eef4ff; stroke: #c8d7f2; stroke-width: 1; rx: 12; }
      .good { fill: #e9f8ef; stroke: #41a66b; stroke-width: 1; rx: 10; }
      .warn { fill: #fff5df; stroke: #a66a16; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect class="page" width="1440" height="860"/>
  <text class="eyebrow" x="84" y="78">CLINICIAN EXPERIENCE</text>
  <text class="ink" x="84" y="138" font-size="44" font-weight="800">Review, verify, then act</text>
  <text class="muted" x="84" y="178" font-size="19">A production interface should make draft status, citations, and approval controls impossible to miss.</text>

  <rect class="shell" x="72" y="220" width="1296" height="560"/>
  <rect class="topbar" x="72" y="220" width="1296" height="64" rx="28"/>
  <rect class="topbar" x="72" y="252" width="1296" height="32"/>
  <text x="108" y="260" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Care Transition Copilot</text>
  <text x="1298" y="260" fill="#dce9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">Dr. Alvarez</text>

  <rect class="side" x="72" y="284" width="190" height="496"/>
  <text class="muted" x="106" y="330" font-size="13" font-weight="800">WORKSPACE</text>
  <rect x="98" y="356" width="138" height="38" rx="12" fill="#e8f5f3"/>
  <text class="ink" x="118" y="380" font-size="14" font-weight="800">Risk queue</text>
  <text class="muted" x="118" y="428" font-size="14">Patients</text>
  <text class="muted" x="118" y="470" font-size="14">Care plans</text>
  <text class="muted" x="118" y="512" font-size="14">Fairness</text>
  <text class="muted" x="118" y="554" font-size="14">Audit log</text>

  <g transform="translate(296 318)">
    <rect class="card" x="0" y="0" width="304" height="392"/>
    <text class="ink" x="24" y="36" font-size="20" font-weight="800">Risk queue</text>
    <text class="muted" x="24" y="62" font-size="14">Flagged after discharge</text>
    <rect class="soft" x="24" y="88" width="256" height="66"/>
    <text class="ink" x="44" y="118" font-size="16" font-weight="800">James Whitaker</text>
    <text class="muted" x="44" y="141" font-size="13">CHF - cardiology follow-up</text>
    <circle cx="246" cy="121" r="24" fill="#fff1f2" stroke="#c23b4b" stroke-width="2"/>
    <text x="246" y="126" fill="#c23b4b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">0.86</text>
    <line class="line" x1="24" y1="178" x2="280" y2="178"/>
    <text class="ink" x="44" y="216" font-size="15" font-weight="800">Maria Ortiz</text>
    <text class="muted" x="44" y="239" font-size="13">COPD - medication change</text>
    <text class="ink" x="246" y="230" font-size="15" font-weight="800" text-anchor="middle">0.79</text>
    <line class="line" x1="24" y1="266" x2="280" y2="266"/>
    <text class="ink" x="44" y="304" font-size="15" font-weight="800">Samuel Patel</text>
    <text class="muted" x="44" y="327" font-size="13">Diabetes - missed visit</text>
    <text class="ink" x="246" y="318" font-size="15" font-weight="800" text-anchor="middle">0.68</text>
  </g>

  <g transform="translate(632 318)">
    <rect class="card" x="0" y="0" width="332" height="392"/>
    <text class="ink" x="24" y="36" font-size="20" font-weight="800">Patient evidence</text>
    <text class="muted" x="24" y="62" font-size="14">Why the model and agent flagged this case</text>
    <rect class="pill" x="24" y="88" width="122" height="32"/>
    <text class="ink" x="85" y="109" font-size="13" font-weight="800" text-anchor="middle">High risk</text>
    <rect class="pill" x="158" y="88" width="140" height="32"/>
    <text class="ink" x="228" y="109" font-size="13" font-weight="800" text-anchor="middle">Cited context</text>
    <rect class="soft" x="24" y="148" width="284" height="54"/>
    <text class="ink" x="44" y="178" font-size="14" font-weight="800">NYHA class III heart failure</text>
    <text class="muted" x="44" y="194" font-size="12">source: discharge summary</text>
    <rect class="soft" x="24" y="220" width="284" height="54"/>
    <text class="ink" x="44" y="250" font-size="14" font-weight="800">Prior readmission within 60 days</text>
    <text class="muted" x="44" y="266" font-size="12">source: encounter history</text>
    <rect class="soft" x="24" y="292" width="284" height="54"/>
    <text class="ink" x="44" y="322" font-size="14" font-weight="800">Medication reconciliation needed</text>
    <text class="muted" x="44" y="338" font-size="12">source: discharge medication list</text>
  </g>

  <g transform="translate(996 318)">
    <rect class="draft" x="0" y="0" width="324" height="392"/>
    <text class="ink" x="24" y="36" font-size="20" font-weight="800">Draft follow-up plan</text>
    <text class="muted" x="24" y="62" font-size="14">AI-generated - pending clinician action</text>
    <line x1="24" y1="86" x2="300" y2="86" stroke="#e3c06f" stroke-width="2"/>
    <text class="ink" x="24" y="122" font-size="14" font-weight="800">Checklist critique</text>
    <rect class="good" x="24" y="140" width="276" height="34"/>
    <text class="ink" x="44" y="162" font-size="13" font-weight="700">Follow-up window included</text>
    <rect class="good" x="24" y="184" width="276" height="34"/>
    <text class="ink" x="44" y="206" font-size="13" font-weight="700">Chart evidence cited</text>
    <rect class="warn" x="24" y="228" width="276" height="34"/>
    <text class="ink" x="44" y="250" font-size="13" font-weight="700">Confirm med reconciliation owner</text>
    <text class="ink" x="24" y="300" font-size="14">Cardiology follow-up within 7 days</text>
    <text class="ink" x="24" y="326" font-size="14">Nurse call within 48 hours</text>
    <rect class="button" x="24" y="346" width="88" height="34"/>
    <text x="68" y="368" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Approve</text>
    <rect class="button2" x="126" y="346" width="74" height="34"/>
    <text class="ink" x="163" y="368" font-size="13" font-weight="800" text-anchor="middle">Edit</text>
    <rect class="button3" x="214" y="346" width="86" height="34"/>
    <text x="257" y="368" fill="#c23b4b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Reject</text>
  </g>

  <g transform="translate(296 728)">
    <rect class="alert" x="0" y="0" width="1024" height="34"/>
    <text x="24" y="22" fill="#c23b4b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Fairness watch:</text>
    <text class="muted" x="126" y="22" font-size="13">subgroup calibration and false-negative parity are surfaced in the main workflow.</text>
  </g>
</svg>
