name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Create isolated Python environment
        run: |
          python -m pip install uv==0.11.3
          python -m venv .venv-ci
          python - <<'PY'
          import os
          from pathlib import Path
          python = (Path('.venv-ci') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')).resolve()
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as handle:
              handle.write(str(python.parent) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('CARE_TRANSITION_TEST_PYTHON=' + str(python) + '\n')
          PY
      - name: Install locked Python dependencies
        run: uv pip sync --python "$CARE_TRANSITION_TEST_PYTHON" requirements.lock
      - name: Run Python tests
        run: python -m pytest -q tests --junitxml=test-results/python.xml
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build local frontend
        working-directory: web
        run: npm run build:local
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser workflows
        working-directory: web
        run: npm run test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          retention-days: 7
          path: |
            test-results/python.xml
            web/test-results/
            web/playwright-report/

  containers:
    name: Linux containers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ci
          load: true
          tags: copilot-ci:test
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Run Python and browser workflows in container
        run: |
          mkdir -p test-results web/test-results web/playwright-report
          docker run --rm --init --shm-size=1g \
            -v "$PWD/test-results:/app/test-results" \
            -v "$PWD/web/test-results:/app/web/test-results" \
            -v "$PWD/web/playwright-report:/app/web/playwright-report" \
            copilot-ci:test
      - name: Build deployable application
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: copilot:check
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Verify runtime imports and excludes test endpoints
        run: |
          docker run --rm copilot:check python -c "import importlib.util; from src.api.local import create_app; app = create_app(); assert importlib.util.find_spec('tests') is None; assert not any('__test__' in getattr(route, 'path', '') for route in app.routes)"
      - name: Upload container test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-linux-container
          retention-days: 7
          path: |
            test-results/python.xml
            web/test-results/
            web/playwright-report/
