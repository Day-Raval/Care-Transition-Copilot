name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Preview package version (manual runs do not publish a release)"
        required: true
        default: v0.0.0-preview
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  package:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require source commit from main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build application
        working-directory: web
        run: |
          npm ci
          npm run build:local
      - name: Build versioned package and checksums
        run: python -m scripts.release --version "$VERSION" --commit "$GITHUB_SHA" --output release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-deployment
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-deployment
          path: release-artifacts
      - name: Verify downloadable package
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish tagged GitHub release
        run: gh release create "$VERSION" release-artifacts/*.zip release-artifacts/SHA256SUMS --verify-tag --title "Care Transition Copilot $VERSION" --generate-notes
