<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phase 1 Planner — Care Transition Copilot</title>
<style>
  :root {
    --navy: #1B2A4A;
    --navy-light: #22345C;
    --teal: #1F7A78;
    --teal-light: #E4F3F2;
    --gold: #A87A2E;
    --gold-bg: #FBF3E4;
    --gray: #6B7280;
    --dark-gray: #374151;
    --border: #E5E7EB;
    --green: #1F7A4D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F8FA;
    color: var(--dark-gray);
  }
  .header {
    background: var(--navy);
    color: white;
    padding: 28px 32px 22px;
  }
  .header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .header p {
    margin: 0;
    font-size: 13px;
    color: #CBD5E1;
    font-style: italic;
  }
  .overall-progress {
    max-width: 1000px;
    margin: 0 auto;
    padding: 18px 32px 0;
  }
  .overall-bar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--gray);
  }
  .overall-bar-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .overall-bar-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 32px 60px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    color: var(--dark-gray);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all 0.15s ease;
  }
  .tab:hover { border-color: var(--teal); }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }
  .tab-check {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: white;
    flex-shrink: 0;
  }
  .tab-check.done { background: var(--green); }
  .tab.active .tab-check:not(.done) { background: rgba(255,255,255,0.25); }

  .day-panel {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 26px 28px;
    display: none;
  }
  .day-panel.active { display: block; }
  .day-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .day-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);
    margin: 0;
  }
  .day-count {
    font-size: 12.5px;
    color: var(--gray);
  }
  .day-goal {
    font-size: 13.5px;
    color: var(--gray);
    font-style: italic;
    margin: 4px 0 18px;
  }
  .day-bar-track {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .day-bar-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #F1F2F4;
    cursor: pointer;
  }
  .task:last-of-type { border-bottom: none; }
  .checkbox {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--teal);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .checkbox.checked {
    background: var(--teal);
  }
  .checkbox.checked::after {
    content: "\2713";
    color: white;
    font-size: 13px;
    font-weight: bold;
  }
  .task-text {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--dark-gray);
  }
  .task.done .task-text {
    color: var(--gray);
    text-decoration: line-through;
    text-decoration-color: var(--border);
  }
  .exit-check {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--gold-bg);
    border: 1.5px solid var(--gold);
    border-radius: 8px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .exit-check .label {
    font-size: 11px;
    font-weight: 700;
    color: #8A6524;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
    margin-top: 1px;
  }
  .exit-check .text {
    font-size: 13.5px;
    color: #5C4420;
    line-height: 1.5;
  }
  .reset-link {
    margin-top: 24px;
    text-align: center;
  }
  .reset-link button {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }
  .note {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 32px 30px;
    font-size: 12px;
    color: var(--gray);
    text-align: center;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Phase 1 Planner — Data &amp; Risk Model</h1>
  <p>Care Transition Copilot &middot; 7 days &middot; see the data, understand it, get a baseline model with a fairness check</p>
</div>

<div class="overall-progress">
  <div class="overall-bar-row">
    <span id="overallLabel">0 / 0 tasks complete</span>
    <div class="overall-bar-track"><div class="overall-bar-fill" id="overallBar" style="width:0%"></div></div>
  </div>
</div>

<div class="container">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="reset-link"><button onclick="resetAll()">Reset all progress</button></div>
</div>

<div class="note">Progress is saved on this device automatically — reopen this file anytime to pick up where you left off.</div>

<script>
const DAYS = [
  {
    title: "Day 1 — Get real (synthetic) data in hand",
    goal: "Get comfortable with what's actually in a FHIR bundle before writing any parsing code.",
    tasks: [
      "Install Synthea and generate ~500\u20131,000 synthetic patients with realistic comorbidity/readmission patterns",
      "Confirm the FHIR bundles contain what you need: Encounter, Condition, MedicationRequest, DocumentReference",
      "Spot-check 5\u201310 patient bundles by hand \u2014 read the raw JSON, don't automate anything yet"
    ],
    exit: "You can point to one patient's full bundle and explain every field in it."
  },
  {
    title: "Day 2 — Parse into the canonical schema",
    goal: "Turn raw FHIR bundles into the flat DischargeRecord schema everything else builds on.",
    tasks: [
      "Build the FHIR parser from docs/data_documentation.md \u2014 bundle in, DischargeRecord out",
      "Run it across all synthetic patients, dump to a flat table (CSV or Postgres)",
      "Log and count parse failures instead of silently dropping them"
    ],
    exit: "One row per encounter in a dataframe, every schema field populated or explicitly null."
  },
  {
    title: "Day 3 — Exploratory data analysis",
    goal: "Understand the shape of the data before engineering anything on top of it.",
    tasks: [
      "Plot distributions: age, length of stay, medication count, diagnosis frequency",
      "Check class balance first \u2014 what fraction of encounters are followed by a 30-day readmission?",
      "Build a missingness map \u2014 which fields are sparse, and is it random or systematic?",
      "Check for label leakage risks in the raw data"
    ],
    exit: "A short written summary: readmission rate, top missingness issues, anything surprising."
  },
  {
    title: "Day 4 — Feature engineering",
    goal: "Turn raw codes and dates into features the model can actually generalize from.",
    tasks: [
      "Group raw ICD-10 codes into Elixhauser or Charlson comorbidity categories",
      "Build medication count + specific high-risk flags (anticoagulants, diuretics, insulin)",
      "Derive length of stay, prior admissions in 90 days, discharge day-of-week",
      "Keep protected attributes (sex, age, etc.) in a separate column set \u2014 never joined into the training matrix"
    ],
    exit: "The full feature set from the data doc, populated and sanity-checked."
  },
  {
    title: "Day 5 — Define the target carefully",
    goal: "Get the survival/hazard target right before fitting anything \u2014 this is easy to get subtly wrong.",
    tasks: [
      "Define the event (readmission) and time-to-event window explicitly",
      "Handle censoring for patients with no readmission and no full 90-day observation",
      "Decide the prediction horizon precisely (30 days from discharge, measured how)"
    ],
    exit: "A target column you can defend in one sentence, with censoring handled \u2014 not a binary flag guessed from missing data."
  },
  {
    title: "Day 6 — Baseline model",
    goal: "Get an interpretable baseline and confirm the risk signal is real before adding complexity.",
    tasks: [
      "Fit a first model \u2014 start with Cox proportional hazards before Random Survival Forest",
      "Evaluate with concordance index (C-index), not accuracy",
      "Run SHAP on the baseline and sanity-check that top features make clinical sense"
    ],
    exit: "A C-index noticeably better than random (>0.6 is a reasonable first bar), and SHAP output that passes the smell test."
  },
  {
    title: "Day 7 — Fairness audit + writeup",
    goal: "Close Phase 1 with an honest read on fairness and a summary the next phase can build on.",
    tasks: [
      "Run Fairlearn across protected-attribute subgroups \u2014 calibration and false-negative-rate parity",
      "Document any subgroup gaps honestly, even if the fix comes later",
      "Write a short Phase 1 summary: data quality, feature set, baseline performance, fairness results, open risks"
    ],
    exit: "You could hand this summary to someone else and they'd understand exactly what the model does and doesn't do well yet."
  }
];

let state = {};

async function loadState() {
  try {
    const result = await window.storage.get('phase1-planner-state', false);
    state = result ? JSON.parse(result.value) : {};
  } catch (e) {
    state = {};
  }
  render();
}

async function saveState() {
  try {
    await window.storage.set('phase1-planner-state', JSON.stringify(state), false);
  } catch (e) {
    console.error('Could not save progress', e);
  }
}

function toggleTask(dayIdx, taskIdx) {
  const key = dayIdx + '-' + taskIdx;
  state[key] = !state[key];
  saveState();
  render();
}

function resetAll() {
  if (confirm('Clear all checked progress? This cannot be undone.')) {
    state = {};
    saveState();
    render();
  }
}

let activeDay = 0;

function switchDay(idx) {
  activeDay = idx;
  render();
}

function dayCompletion(dayIdx) {
  const total = DAYS[dayIdx].tasks.length;
  let done = 0;
  for (let i = 0; i < total; i++) if (state[dayIdx + '-' + i]) done++;
  return { done, total };
}

function render() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  let overallDone = 0, overallTotal = 0;

  DAYS.forEach((day, idx) => {
    const { done, total } = dayCompletion(idx);
    overallDone += done;
    overallTotal += total;
    const tab = document.createElement('div');
    tab.className = 'tab' + (idx === activeDay ? ' active' : '');
    const isFullyDone = done === total;
    tab.innerHTML = `<span class="tab-check${isFullyDone ? ' done' : ''}">${isFullyDone ? '\u2713' : (idx + 1)}</span> Day ${idx + 1}`;
    tab.onclick = () => switchDay(idx);
    tabsEl.appendChild(tab);
  });

  document.getElementById('overallLabel').textContent = `${overallDone} / ${overallTotal} tasks complete`;
  document.getElementById('overallBar').style.width = (overallTotal ? (overallDone / overallTotal * 100) : 0) + '%';

  const panelsEl = document.getElementById('panels');
  panelsEl.innerHTML = '';
  const day = DAYS[activeDay];
  const { done, total } = dayCompletion(activeDay);

  const panel = document.createElement('div');
  panel.className = 'day-panel active';
  panel.innerHTML = `
    <div class="day-title-row">
      <h2 class="day-title">${day.title}</h2>
      <span class="day-count">${done}/${total} done</span>
    </div>
    <p class="day-goal">${day.goal}</p>
    <div class="day-bar-track"><div class="day-bar-fill" style="width:${total ? (done/total*100) : 0}%"></div></div>
    <div class="tasks"></div>
    <div class="exit-check">
      <span class="label">Exit check</span>
      <span class="text">${day.exit}</span>
    </div>
  `;
  const tasksEl = panel.querySelector('.tasks');
  day.tasks.forEach((t, tIdx) => {
    const key = activeDay + '-' + tIdx;
    const isDone = !!state[key];
    const taskEl = document.createElement('div');
    taskEl.className = 'task' + (isDone ? ' done' : '');
    taskEl.innerHTML = `<div class="checkbox${isDone ? ' checked' : ''}"></div><div class="task-text">${t}</div>`;
    taskEl.onclick = () => toggleTask(activeDay, tIdx);
    tasksEl.appendChild(taskEl);
  });

  panelsEl.appendChild(panel);
}

loadState();
</script>

</body>
</html>
